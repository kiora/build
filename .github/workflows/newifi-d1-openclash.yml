name: Build Newifi D1 OpenClash

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'chatgpt-newifi-d1/**'
      - '.github/workflows/newifi-d1-openclash.yml'

concurrency:
  group: newifi-d1-openclash
  cancel-in-progress: true

env:
  # Bump this only when the pinned LEDE/feed baseline intentionally changes.
  # Script fixes keep the same prefix so the next run restores the latest build tree.
  CACHE_PREFIX: newifi-d1-openclash-20240513-v1

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout helper repo
        uses: actions/checkout@v4

      - name: Restore latest build checkpoint
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: |
            newifi-d1-build
            newifi-d1-output
          key: ${{ env.CACHE_PREFIX }}-${{ github.run_id }}-restore
          restore-keys: |
            ${{ env.CACHE_PREFIX }}-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev \
            libssl-dev python3-distutils python3-setuptools rsync swig unzip zlib1g-dev file wget \
            curl jq time xsltproc libelf-dev ecj fastjar java-propose-classpath python3 python3-dev \
            python3-pip python3-ply python3-docutils python3-pyelftools libpython3-dev qemu-utils \
            ccache subversion mercurial libtool-bin automake autoconf autopoint device-tree-compiler \
            antlr3 asciidoc help2man intltool po4a libglib2.0-dev xmlto squashfs-tools
          chmod +x chatgpt-newifi-d1/build_newifi_d1.sh

      - name: Step 1 - Prepare source and pinned feeds
        id: prepare
        run: ./chatgpt-newifi-d1/build_newifi_d1.sh prepare
      - name: Save checkpoint 1 - prepare
        if: always() && steps.prepare.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            newifi-d1-build
            newifi-d1-output
          key: ${{ env.CACHE_PREFIX }}-${{ github.run_id }}-01-prepare

      - name: Apply final low-memory fixes to restored source
        shell: bash
        run: |
          set -euo pipefail
          cd newifi-d1-build/lede
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('package/luci-app-openclash/luasrc/controller/openclash.lua')
          s=p.read_text()
          s,n=re.subn(r'(?:local\s+)?function\s+coremetacv\(\).*?\nend', 'local function coremetacv()\n\treturn "unknown" -- avoid a second large core process\nend', s, count=1, flags=re.S)
          if n != 1: raise SystemExit('coremetacv patch failed')
          p.write_text(s)
          p=Path('files/etc/init.d/openclash_core_stage')
          s=p.read_text().replace('chmod 4755', 'chmod 755')
          s=s.replace('cp -f "$SD_CORE" "$RAM_CORE.tmp" || return 1', 'cp -f "$SD_CORE" "$RAM_CORE.tmp" || return 1\n        cmp -s "$SD_CORE" "$RAM_CORE.tmp" || { rm -f "$RAM_CORE.tmp"; return 1; }')
          p.write_text(s)
          p=Path('files/etc/uci-defaults/99-openclash-lowmem')
          s=p.read_text().replace("uci -q commit openclash", "uci -q set openclash.config.enable='0'\nuci -q set openclash.config.core_type='Meta'\nuci -q set openclash.config.core_version='linux-mipsle-softfloat'\n/etc/init.d/openclash disable\nuci -q commit openclash")
          p.write_text(s)
          p=Path('package/luci-app-openclash/root/usr/share/openclash/openclash_core.sh')
          p.write_text(p.read_text().replace('chmod 4755 /mnt/mmcblk0p1', 'chmod 755 /mnt/mmcblk0p1'))
          # Keep large mutable geodata out of Flash.
          for rel in ('GeoSite.dat', 'rule_provider/oc-cn-domain.mrs'):
              (Path('package/luci-app-openclash/root/etc/openclash')/rel).unlink(missing_ok=True)
          PY
          make package/luci-app-openclash/clean V=s
          rm -f ../.checkpoints/packages.ready ../.checkpoints/world.ready ../.checkpoints/verify.ready
          mkdir -p "$GITHUB_WORKSPACE/newifi-d1-output/applied-files"
          cp -a files "$GITHUB_WORKSPACE/newifi-d1-output/applied-files/"
          cp package/luci-app-openclash/luasrc/controller/openclash.lua "$GITHUB_WORKSPACE/newifi-d1-output/applied-files/"
          cp package/luci-app-openclash/root/usr/share/openclash/openclash_core.sh "$GITHUB_WORKSPACE/newifi-d1-output/applied-files/"
          cp package/luci-app-openclash/root/usr/share/openclash/openclash_debug.sh "$GITHUB_WORKSPACE/newifi-d1-output/applied-files/"
          echo 'LUCI coremetacv patched; core copy byte-checked; first boot disabled; geodata excluded' >> "$GITHUB_WORKSPACE/newifi-d1-output/NEWIFI_LOW_MEMORY_PATCH_REPORT.txt"

      - name: Step 2 - Download sources
        id: download
        run: ./chatgpt-newifi-d1/build_newifi_d1.sh download
      - name: Save checkpoint 2 - download
        if: always() && steps.download.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            newifi-d1-build
            newifi-d1-output
          key: ${{ env.CACHE_PREFIX }}-${{ github.run_id }}-02-download

      - name: Step 3 - Build tools and toolchain
        id: toolchain
        continue-on-error: true
        run: ./chatgpt-newifi-d1/build_newifi_d1.sh toolchain
      - name: Save checkpoint 3 - toolchain partial or complete
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            newifi-d1-build
            newifi-d1-output
          key: ${{ env.CACHE_PREFIX }}-${{ github.run_id }}-03-toolchain-${{ steps.toolchain.outcome }}
      - name: Gate toolchain
        if: steps.toolchain.outcome != 'success'
        run: exit 1

      - name: Step 4 - Build target/kernel
        id: target
        continue-on-error: true
        run: ./chatgpt-newifi-d1/build_newifi_d1.sh target
      - name: Save checkpoint 4 - target partial or complete
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            newifi-d1-build
            newifi-d1-output
          key: ${{ env.CACHE_PREFIX }}-${{ github.run_id }}-04-target-${{ steps.target.outcome }}
      - name: Gate target
        if: steps.target.outcome != 'success'
        run: exit 1

      - name: Step 5 - Compile packages
        id: packages
        continue-on-error: true
        run: ./chatgpt-newifi-d1/build_newifi_d1.sh packages
      - name: Save checkpoint 5 - package partial or complete
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            newifi-d1-build
            newifi-d1-output
          key: ${{ env.CACHE_PREFIX }}-${{ github.run_id }}-05-packages-${{ steps.packages.outcome }}
      - name: Gate packages
        if: steps.packages.outcome != 'success'
        run: exit 1

      - name: Step 6 - Build final world/image
        id: world
        continue-on-error: true
        run: ./chatgpt-newifi-d1/build_newifi_d1.sh world
      - name: Save checkpoint 6 - world partial or complete
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            newifi-d1-build
            newifi-d1-output
          key: ${{ env.CACHE_PREFIX }}-${{ github.run_id }}-06-world-${{ steps.world.outcome }}
      - name: Gate world
        if: steps.world.outcome != 'success'
        run: exit 1

      - name: Step 7 - Verify sysupgrade image
        id: verify
        run: ./chatgpt-newifi-d1/build_newifi_d1.sh verify
      - name: Save checkpoint 7 - verified
        if: always() && steps.verify.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            newifi-d1-build
            newifi-d1-output
          key: ${{ env.CACHE_PREFIX }}-${{ github.run_id }}-07-verified

      - name: Step 8 - Audit actual SquashFS rootfs
        id: rootfs_audit
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/newifi-d1-output"
          FINAL="$OUT/newifi-d1-openclash-optimized-squashfs-sysupgrade.bin"
          ROOTFS="$RUNNER_TEMP/newifi-d1-rootfs-audit"
          REPORT="$OUT/ROOTFS_VALIDATION.txt"
          PKGLIST="$OUT/ROOTFS_PACKAGE_LIST.txt"
          sudo rm -rf "$ROOTFS"
          : > "$REPORT"

          OFFSET=$(python3 - "$FINAL" <<'PY'
          import struct, sys
          p = sys.argv[1]
          with open(p, 'rb') as f:
              h = f.read(64)
          if len(h) != 64 or h[:4] != b'\x27\x05\x19\x56':
              raise SystemExit('not a legacy uImage')
          size = struct.unpack('>I', h[12:16])[0]
          print(64 + size)
          PY
          )
          echo "ROOTFS_OFFSET=$OFFSET" | tee -a "$REPORT"
          printf 'ROOTFS_MAGIC=' | tee -a "$REPORT"
          dd if="$FINAL" bs=1 skip="$OFFSET" count=4 status=none | od -An -tx1 | tr -d ' \n' | tee -a "$REPORT"
          echo | tee -a "$REPORT"

          unsquashfs -s -o "$OFFSET" "$FINAL" | tee "$OUT/ROOTFS_SQUASHFS_INFO.txt"
          sudo unsquashfs -f -d "$ROOTFS" -o "$OFFSET" "$FINAL" >/dev/null
          test -s "$ROOTFS/usr/lib/opkg/status"
          STATUS="$ROOTFS/usr/lib/opkg/status"
          awk '/^Package: /{p=$2} /^Version: /{print p " " $2}' "$STATUS" | sort > "$PKGLIST"

          required=(
            luci-app-openclash dnsmasq-full iptables iptables-mod-extra iptables-mod-tproxy
            ipset kmod-ipt-ipset kmod-ipt-tproxy kmod-tun ppp ppp-mod-pppoe
            block-mount e2fsprogs kmod-fs-ext4 kmod-mmc kmod-sdhci-mt7620 ruby ruby-yaml
          )
          excluded=(
            luci-app-ssr-plus zerotier luci-app-zerotier xray-core frpc luci-app-frpc
            simple-obfs-client vlmcsd luci-app-vlmcsd vsftpd-alt luci-app-vsftpd
            samba36-server luci-app-samba
          )

          for p in "${required[@]}"; do
            if grep -qx "$p .*" "$PKGLIST"; then
              echo "REQUIRED_OK=$p" >> "$REPORT"
            else
              echo "REQUIRED_MISSING=$p" >> "$REPORT"
              exit 1
            fi
          done
          for p in "${excluded[@]}"; do
            if grep -qx "$p .*" "$PKGLIST"; then
              echo "EXCLUDED_PRESENT=$p" >> "$REPORT"
              exit 1
            else
              echo "EXCLUDED_OK=$p" >> "$REPORT"
            fi
          done

          OC_VER=$(awk '$1=="luci-app-openclash"{print $2}' "$PKGLIST")
          echo "OPENCLASH_INSTALLED_VERSION=$OC_VER" >> "$REPORT"

          test -x "$ROOTFS/etc/init.d/openclash_swap"
          test -x "$ROOTFS/etc/init.d/openclash_core_stage"
          test -s "$ROOTFS/etc/uci-defaults/99-openclash-lowmem"
          grep -q '^START=90$' "$ROOTFS/etc/init.d/openclash_swap"
          grep -q '^START=95$' "$ROOTFS/etc/init.d/openclash_core_stage"
          grep -q "small_flash_memory='1'" "$ROOTFS/etc/uci-defaults/99-openclash-lowmem"
          grep -q 'SD_MOUNT="/mnt/mmcblk0p1"' "$ROOTFS/etc/init.d/openclash_core_stage"
          grep -Fq 'SD_CORE="$SD_MOUNT/openclash/core/clash_meta"' "$ROOTFS/etc/init.d/openclash_core_stage"
          grep -q 'RAM_DIR="/tmp/etc/openclash/core"' "$ROOTFS/etc/init.d/openclash_core_stage"
          echo 'LOWMEM_SERVICES=PASS' >> "$REPORT"

          CORE_UPDATER="$ROOTFS/usr/share/openclash/openclash_core.sh"
          DEBUG_SCRIPT="$ROOTFS/usr/share/openclash/openclash_debug.sh"
          CONTROLLER="$ROOTFS/usr/lib/lua/luci/controller/openclash.lua"
          test -s "$CORE_UPDATER" && test -s "$DEBUG_SCRIPT" && test -s "$CONTROLLER"
          grep -q '/mnt/mmcblk0p1/openclash/core/clash_meta' "$CORE_UPDATER"
          grep -q 'core_meta_version="unknown"' "$DEBUG_SCRIPT"
          echo 'LOWMEM_UPDATER_PATCH=PASS' >> "$REPORT"
          echo 'LOWMEM_DEBUG_PROBE_PATCH=PASS' >> "$REPORT"

          if find "$ROOTFS" -type f \( -name 'clash_meta' -o -name 'mihomo' -o -name 'clash' \) -print | grep -q .; then
            echo 'ERROR=core_binary_embedded_in_rootfs' >> "$REPORT"
            find "$ROOTFS" -type f \( -name 'clash_meta' -o -name 'mihomo' -o -name 'clash' \) -printf 'CORE_FILE=%p %s\n' >> "$REPORT"
            exit 1
          fi
          echo 'NO_CORE_BINARY_IN_ROOTFS=PASS' >> "$REPORT"

          # Report whether the LuCI status endpoint itself executes the large core just to read a version.
          python3 - "$CONTROLLER" "$REPORT" <<'PY'
          import re, sys
          path, report = sys.argv[1:]
          s = open(path, 'r', errors='replace').read()
          m = re.search(r'function\s+coremetacv\s*\(\)(.*?)(?=\nfunction\s+|\Z)', s, re.S)
          status = 'UNKNOWN'
          if m:
              body = m.group(1)
              status = 'PROBE_PRESENT' if re.search(r'meta_core_path.*-v|-v.*meta_core_path', body) else 'NO_EXTRA_PROBE'
          with open(report, 'a') as f:
              f.write('LUCI_CORE_VERSION_PROBE=' + status + '\n')
          if status != 'NO_EXTRA_PROBE': raise SystemExit('LuCI launches extra core')
          PY

          find "$ROOTFS/etc/openclash/core" -maxdepth 2 -type f -printf '%p %s\n' 2>/dev/null >> "$REPORT" || true
          sha256sum "$FINAL" >> "$REPORT"
          echo 'ROOTFS_AUDIT=PASS' >> "$REPORT"
          cat "$REPORT"
          rm -rf "$ROOTFS"

      - name: Save checkpoint 8 - rootfs audited
        if: always() && steps.rootfs_audit.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            newifi-d1-build
            newifi-d1-output
          key: ${{ env.CACHE_PREFIX }}-${{ github.run_id }}-08-rootfs-audited

      - name: Upload current progress/output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newifi-d1-openclash-build-output
          path: newifi-d1-output/
          if-no-files-found: warn
          retention-days: 7
